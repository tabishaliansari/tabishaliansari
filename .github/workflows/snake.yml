name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0a0a0a&color_dots=#ebedf0,#c6c8cc,#8b8d91,#57585c,#0a0a0a
            dist/snake-dark.svg?color_snake=#ededed&color_dots=#161b22,#2a2f36,#5a626c,#a3a3a3,#ededed

      # The SVGs are pushed to an orphan `output` branch so they never clutter
      # main. The README points at raw.githubusercontent.com/.../output/...
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
